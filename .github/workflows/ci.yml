name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Test batch validation helpers
        working-directory: part1-batch-databricks/test-harness
        run: sbt test

      - name: Test streaming transformations
        working-directory: part2-streaming-iceberg
        run: sbt test

      - name: Test producer
        working-directory: producer
        run: sbt test

      - name: Build producer image
        working-directory: producer
        run: docker build -t nexus-kafka-producer:ci .

      - name: Compile streaming application
        working-directory: part2-streaming-iceberg
        run: sbt compile

      - name: Package streaming application
        working-directory: part2-streaming-iceberg
        run: sbt package

      - name: Stage streaming JAR for Docker
        working-directory: part2-streaming-iceberg
        run: cp target/out/jvm/scala-2.12.18/kafkastreamingicebergdemo/kafkastreamingicebergdemo_2.12-0.1.0-SNAPSHOT.jar target/app.jar

      - name: Build streaming image
        working-directory: part2-streaming-iceberg
        run: docker build -t nexus-streaming:ci .
