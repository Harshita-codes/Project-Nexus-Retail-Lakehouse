name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Test batch validation helpers
        working-directory: Data Ingestion/Batch/test-harness
        run: sbt test

      - name: Test batch Spark application
        working-directory: Data Ingestion/Batch
        run: sbt test

      - name: Build batch Spark image
        working-directory: Data Ingestion/Batch
        run: docker build -t nexus-batch:ci -f ../../Development/Docker/nexus-batch.Dockerfile .

      - name: Validate batch Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -summary Development/Kubernetes/

      - name: Test streaming transformations
        working-directory: Data Ingestion/Streaming
        run: sbt test

      - name: Test producer
        working-directory: Data Ingestion/Producer
        run: sbt test

      - name: Build producer image
        run: docker build -t nexus-kafka-producer:ci -f Development/Docker/nexus-producer.Dockerfile .

      - name: Compile streaming application
        working-directory: Data Ingestion/Streaming
        run: sbt compile

      - name: Package streaming application
        working-directory: Data Ingestion/Streaming
        run: sbt package

      - name: Stage streaming JAR for Docker
        working-directory: Data Ingestion/Streaming
        run: cp target/out/jvm/scala-2.12.18/kafkastreamingicebergdemo/kafkastreamingicebergdemo_2.12-0.1.0-SNAPSHOT.jar target/app.jar

      - name: Build streaming image
        working-directory: Data Ingestion/Streaming
        run: docker build -t nexus-streaming:ci -f ../../Development/Docker/nexus-streaming.Dockerfile .
