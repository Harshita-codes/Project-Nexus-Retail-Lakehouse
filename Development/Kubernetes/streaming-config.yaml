apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-streaming-config
  namespace: streaming
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: order-events
  REFERENCE_DATA_DIR: file:///data/reference
  ICEBERG_WAREHOUSE: file:///lakehouse/warehouse
  DELTA_WAREHOUSE: file:///lakehouse/delta/retail_nexus
  STREAM_CHECKPOINT_DIR: file:///lakehouse/checkpoints/project_nexus
  EVENT_TIME_WATERMARK_DELAY_SECONDS: "600"
  EVENT_TIME_WATERMARK_STATE_FILE: /lakehouse/watermark/event-time-watermark.txt
  GOLD_WINDOW_SECONDS: "600"
  SPARK_MASTER: local[*]
  SPARK_SHUFFLE_PARTITIONS: "4"
  READY_FILE: /tmp/nexus-streaming-ready
